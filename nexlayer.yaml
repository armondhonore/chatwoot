application:
  name: chatwoot
  pods:
  - name: app
    image: chatwoot/chatwoot:latest
    path: /
    servicePorts:
    - 3000
    vars:
      SECRET_KEY_BASE: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6"
      DATABASE_URL: "postgres://chatwoot:chatwoot@postgres.pod:5432/chatwoot"
      REDIS_URL: "redis://redis.pod:6379"
      RAILS_ENV: production
      FRONTEND_URL: "https://relaxed-weasel-chatwoot.cloud.nexlayer.ai"
      ACTIVE_STORAGE_SERVICE: local
      MAILER_SENDER_EMAIL: "armond@nexlayer.com"
      SMTP_DOMAIN: "nexlayer.com"
      ENABLE_ACCOUNT_SIGNUP: "true"
    volumes:
    - name: chatwoot-storage
      mountPath: /app/storage
      size: 10Gi
  - name: postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot
    volumes:
    - name: chatwoot-db
      mountPath: /var/lib/postgresql/data
      size: 5Gi
  - name: redis
    image: redis:7-alpine
    servicePorts:
    - 6379
    volumes:
    - name: chatwoot-redis
      mountPath: /data
      size: 2Gi
