application:
  name: chatwoot
  pods:
  - name: app
    # Built by the Nexlayer pipeline from the repo root Dockerfile (thin wrapper
    # over the official chatwoot/chatwoot image with the correct boot command).
    image: chatwoot/chatwoot:v4.15.1
    path: /
    servicePorts:
    - 3000
    vars:
      SECRET_KEY_BASE: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6"
      # Reference chatwoot's OWN db/redis by their full service names — NOT
      # postgres.pod/redis.pod, which collide with other apps in the shared ns.
      POSTGRES_HOST: chatwoot-postgres-service
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: chatwoot
      POSTGRES_DATABASE: chatwoot
      DATABASE_URL: "postgres://chatwoot:chatwoot@chatwoot-postgres-service:5432/chatwoot"
      REDIS_URL: "redis://chatwoot-redis-service:6379"
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      RAILS_LOG_TO_STDOUT: "true"
      FRONTEND_URL: "https://relaxed-weasel-chatwoot.cloud.nexlayer.ai"
      ACTIVE_STORAGE_SERVICE: local
      MAILER_SENDER_EMAIL: "armond@nexlayer.com"
      SMTP_DOMAIN: "nexlayer.com"
      ENABLE_ACCOUNT_SIGNUP: "true"
    volumes:
    - name: chatwoot-storage
      mountPath: /app/storage
      size: 10Gi
  - name: postgres
    # Chatwoot REQUIRES the pgvector extension (db:chatwoot_prepare enables
    # `vector`). Plain postgres:16-alpine lacks it — use pgvector/pgvector:pg16.
    image: pgvector/pgvector:pg16
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot
    volumes:
    - name: chatwoot-db
      mountPath: /var/lib/postgresql/data
      size: 5Gi
  - name: redis
    image: redis:7-alpine
    servicePorts:
    - 6379
    volumes:
    - name: chatwoot-redis
      mountPath: /data
      size: 2Gi
